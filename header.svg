<svg viewBox="0 0 800 130" xmlns="http://www.w3.org/2000/svg" width="800">
  <defs>
    <style>
      .name-text {
        font-family: 'DM Sans', 'Segoe UI', sans-serif;
        font-size: 60px;
        font-weight: 700;
        fill: none;
        stroke: #16a34a;
        stroke-width: 2;
        stroke-dasharray: 1200;
        stroke-dashoffset: 1200;
        animation: draw 2.5s ease forwards, fillIn 0.8s ease 2.2s forwards;
        letter-spacing: 8px;
      }
      @keyframes draw {
        to { stroke-dashoffset: 0; }
      }
      @keyframes fillIn {
        to { fill: #16a34a; }
      }
      .sub-text {
        font-family: 'DM Sans', 'Segoe UI', sans-serif;
        font-size: 13px;
        font-weight: 400;
        fill: #6b7280;
        opacity: 0;
        animation: fadeUp 0.8s ease 2.8s forwards;
        letter-spacing: 5px;
      }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .line {
        stroke: #16a34a;
        stroke-width: 1;
        stroke-dasharray: 320;
        stroke-dashoffset: 320;
        animation: drawLine 0.6s ease 2.5s forwards;
        opacity: 0.5;
      }
      @keyframes drawLine {
        to { stroke-dashoffset: 0; }
      }
    </style>
  </defs>
  <rect width="800" height="130" fill="transparent"/>
  <text class="name-text" x="400" y="82" text-anchor="middle">DEVANG</text>
  <line class="line" x1="260" y1="94" x2="540" y2="94"/>
  <text class="sub-text" x="400" y="116" text-anchor="middle">FULL-STACK DEVELOPER</text>
</svg>
