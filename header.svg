<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <style>
      .text-copy {
        fill: none;
        stroke-dasharray: 6% 29%;
        stroke-width: 5px;
        stroke-dashoffset: 0%;
        animation: stroke-offset 5.5s infinite linear;
        font: 800 9em Helvetica, sans-serif;
      }
      .text-copy:nth-child(1) { stroke: #58a6ff; animation-delay: 0s; }
      .text-copy:nth-child(2) { stroke: #3fb950; animation-delay: -1.1s; }
      .text-copy:nth-child(3) { stroke: #f0883e; animation-delay: -2.2s; }
      .text-copy:nth-child(4) { stroke: #d2a8ff; animation-delay: -3.3s; }
      .text-copy:nth-child(5) { stroke: #ff7b72; animation-delay: -4.4s; }
      @keyframes stroke-offset {
        100% { stroke-dashoffset: -35%; }
      }
    </style>
  </defs>
  <rect width="1200" height="200" fill="#0d1117"/>
  <symbol id="a">
    <text x="50%" y="78%" text-anchor="middle">Devang</text>
  </symbol>
  <g>
    <use class="text-copy" xlink:href="#a"/>
    <use class="text-copy" xlink:href="#a"/>
    <use class="text-copy" xlink:href="#a"/>
    <use class="text-copy" xlink:href="#a"/>
    <use class="text-copy" xlink:href="#a"/>
  </g>
</svg>
